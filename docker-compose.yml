services:
  mysql:
    image: mysql:8.0
    container_name: clothing-store-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clothing_store
      MYSQL_USER: store_user
      MYSQL_PASSWORD: store_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing-store-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "mysql://store_user:store_password@mysql:3306/clothing_store"
      JWT_SECRET: "production_secret_jwt_key_clothing_store_2026_xyz!"
      JWT_EXPIRATION: "7d"
      CORS_ORIGIN: "*"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
