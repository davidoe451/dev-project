@if (totalPages() > 0) {
  <nav
    aria-label="Pagination"
    class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-6 border-t border-slate-200 dark:border-slate-800"
  >
    <p class="text-xs text-slate-500 dark:text-slate-400">
      Showing
      <span class="font-bold text-slate-900 dark:text-white">{{ rangeStart() }}</span>
      –
      <span class="font-bold text-slate-900 dark:text-white">{{ rangeEnd() }}</span>
      of
      <span class="font-bold text-slate-900 dark:text-white">{{ totalItems() }}</span>
      results
    </p>

    @if (totalPages() > 1) {
      <div class="flex items-center gap-1.5">
        <app-button
          variant="outline"
          size="sm"
          [disabled]="page() <= 1"
          (click)="goTo(page() - 1)"
          ariaLabel="Previous page"
        >
          <span class="material-symbols-outlined text-base">chevron_left</span>
          <span class="hidden sm:inline">Prev</span>
        </app-button>

        @for (item of pages(); track $index) {
          @if (item === 'ellipsis') {
            <span class="px-2 text-xs text-slate-400 select-none">…</span>
          } @else {
            <app-button
              [variant]="item === page() ? 'primary' : 'ghost'"
              size="sm"
              (click)="goTo(item)"
              [ariaLabel]="'Page ' + item"
            >
              {{ item }}
            </app-button>
          }
        }

        <app-button
          variant="outline"
          size="sm"
          [disabled]="page() >= totalPages()"
          (click)="goTo(page() + 1)"
          ariaLabel="Next page"
        >
          <span class="hidden sm:inline">Next</span>
          <span class="material-symbols-outlined text-base">chevron_right</span>
        </app-button>
      </div>
    }
  </nav>
}
